name: 'datavault'
version: '1.0.0'
config-version: 2

profile: 'datavault'

on-run-end:
  - "{{ log_load_status() }}"

# automate_dv dispatch: Eigene Macros haben Vorrang
dispatch:
  - macro_namespace: automate_dv
    search_order: ['datavault', 'automate_dv']

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

seeds:
  datavault:
    +schema: vault

clean-targets:
  - "target"
  - "dbt_packages"

# seeds: (keine CSV-Seed-Dateien mehr im Projekt)

vars:
  # Hash-Algorithmus: MD5 (16 Byte) oder SHA (32 Byte)
  hash: 'SHA'
  
  # NULL-Placeholder für Hash-Berechnung
  null_placeholder_string: '-1'
  
  # Separator für Multi-Column Hashing
  concat_string: '||'
  
  # Kein UPPER() auf Hash-Inputs (Case-sensitive Daten)
  hash_content_casing: 'DISABLED'
  
  # SQL Server Reserved Keyword Escaping
  escape_char_left: '['
  escape_char_right: ']'
  
  # Datumsspalte für Load Date
  load_date: 'dss_load_date'
  
  # Record Source Spalte
  record_source: 'dss_record_source'

  # SAS Token für list_parquet_files (stage-fs Container, Permissions: rl)
  # Setzen via: export STAGE_FS_SAS="se=...&sp=rl&sv=...&sr=c&sig=..."
  stage_fs_sas: "{{ env_var('STAGE_FS_SAS', '') }}"

# ===========================================
# SCHEMA NAMING CONVENTION
# ===========================================
# [stg].[stg_<entity>]                    - Staging Views
# [vault].[hub|sat|link_<entity>]         - Übergreifende Vault Objekte (_common)
# [vault_<concept>].[hub|sat|link_<ent>]  - Quellsystem-spezifische Vault Objekte
# [mart].[<object>]                       - Übergreifende Mart Objekte (_common)
# [mart_<concept>].[<object>]             - Domain-spezifische Mart Objekte

models:
  datavault:
    staging:
      +schema: stg
      +materialized: view
    raw_vault:
      # ===== COMMON (Schema: vault) =====
      # Übergreifende Objekte aus mehreren Quellen
      _common:
        hubs:
          +schema: vault
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        satellites:
          +schema: vault
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        links:
          +schema: vault
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        refs:
          +schema: vault
          +materialized: view
      # ===== IDMS (Schema: dv) =====
      # Internet-Service-Objekte (Quellsystem IDMS)
      idms:
        hubs:
          +schema: dv
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        satellites:
          +schema: dv
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
      # ===== TELECOM (Schema: vault_telecom) =====
      # Telekommunikations-spezifische Objekte (RSN/Compax Mobile + später Festnetz)
      # Tag: cdr — nur via deploy:cdr-load Job laden, nicht im regulären dbt run.
      telecom:
        +tags: [cdr]
        hubs:
          +schema: vault_telecom
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        satellites:
          +schema: vault_telecom
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        links:
          +schema: vault_telecom
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        # refs: (noch keine Telecom Reference Tables)
      # ===== ISE / EDM (Schema: vault_ise) =====
      # Energiedaten-Management aus i-SE (Innosolv): Zeitreihen-Stammdaten der
      # Zeitreihegruppe "ewb_Power BI" + ¼-Stunden-Lastgangwerte.
      # Tag: ise — erlaubt selektives Laden analog cdr.
      ise:
        +tags: [ise]
        hubs:
          +schema: vault_ise
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        satellites:
          +schema: vault_ise
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
        links:
          +schema: vault_ise
          +materialized: incremental
          +incremental_strategy: append
          +on_schema_change: append_new_columns
      # ===== JIRA (Schema: vault_jira) =====

    # utils: (models/utils/ leer — zukünftige Business-Vault Utilities)
    business_vault:
      # ===== FINANCE (Schema: mart_finance) =====
      # Abgeleitete Business-Regeln ohne Quellsystem (z.B. Reporting-Hierarchien),
      # nicht zu verwechseln mit raw_vault/_common/refs (Reference Tables AUS Quellsystemen).
      # Schema bewusst = mart_finance (nicht vault): diese Objekte werden direkt von
      # Power BI konsumiert. Endnutzer sollen langfristig nur mart/mart_<domain>
      # sehen, nie vault/stg — daher duerfen konsumierte Business-Vault-Objekte
      # nicht im vault-Schema liegen.
      +schema: mart_finance
      +materialized: view

    mart:
      # ===== COMMON (Schema: mart) =====
      _common:
        +schema: mart
        +materialized: table
        +as_columnstore: false
      # ===== FINANCE (Schema: mart_finance) =====
      finance:
        +schema: mart_finance
        +materialized: table
        +as_columnstore: false
      # ===== PROJEKT (Schema: mart_project) =====
      project:
        +schema: mart_project
        +materialized: table
        +as_columnstore: false
      # ===== JIRA (Schema: mart_jira) — noch keine Modelle =====
      # jira:
      #   +schema: mart_jira
      #   +materialized: table
      #   +as_columnstore: false
      # ===== ISE / EDM (Schema: mart_ise) =====
      # Energiedaten: Zeitreihen-Dimension + ¼-h-Lastgangfakten aus vault_ise.
      # Tag: ise — laedt zusammen mit Staging und Raw Vault der Domaene.
      ise:
        +tags: [ise]
        +schema: mart_ise
        +materialized: table
        +as_columnstore: false
      # ===== MOBILE (Schema: mart_telecom) =====
      # Tag: cdr — nur via deploy:cdr-load Job laden, nicht im regulären dbt run.
      telecom:
        +tags: [cdr]
        +schema: mart_telecom
        +materialized: table
        +as_columnstore: false
