# =============================================================================
# EWB Analytics Platform — GitLab CI/CD
# =============================================================================
# Primäre CI/CD-Konfiguration für EWB GitLab.
# Runner: self-hosted Linux VM (tags: ewb-dbt)
#
# Äquivalente GitHub Actions Workflows bleiben in .github/workflows/ erhalten
# für PPMC-Entwicklung auf github.com/fellnerd/datavault-dbt.
#
# Voraussetzungen (CI/CD Variables in GitLab → Settings → CI/CD → Variables):
#   DBT_EWB_SQL_USER      — SQL Server Benutzername (masked, protected)
#   DBT_EWB_SQL_PASSWORD  — SQL Server Passwort (masked, protected)
# =============================================================================

default:
  # Shell executor: dbt, Python und ODBC Driver 18 sind bereits auf dem Runner-Host installiert.
  # Kein Docker-Image nötig → direkter Zugriff auf Host-Tools.
  tags:
    - ewb-dbt
  before_script:
    - dbt deps --quiet
  interruptible: true

variables:
  DBT_PROFILES_DIR: "$CI_PROJECT_DIR"

# --- Profiles generieren (shared script) ---
.setup_profiles: &setup_profiles |
  mkdir -p "$CI_PROJECT_DIR"
  cat > "$CI_PROJECT_DIR/profiles.yml" << EOF
  datavault:
    target: ewb-dev
    outputs:
      ewb-dev:
        type: sqlserver
        driver: 'ODBC Driver 17 for SQL Server'
        server: "tcp:sql-analytics-ewb-001.database.windows.net"
        port: 1433
        database: datavault-dev
        schema: dv
        authentication: sql
        user: "${DBT_EWB_SQL_USER}"
        password: "${DBT_EWB_SQL_PASSWORD}"
        encrypt: true
        trust_cert: true
        query_timeout: 7200
      ewb-test:
        type: sqlserver
        driver: 'ODBC Driver 17 for SQL Server'
        server: "tcp:sql-analytics-ewb-001.database.windows.net"
        port: 1433
        database: datavault-test
        schema: dv
        authentication: sql
        user: "${DBT_EWB_SQL_USER}"
        password: "${DBT_EWB_SQL_PASSWORD}"
        encrypt: true
        trust_cert: true
        query_timeout: 7200
      ewb:
        type: sqlserver
        driver: 'ODBC Driver 17 for SQL Server'
        server: "tcp:sql-analytics-ewb-001.database.windows.net"
        port: 1433
        database: datavault
        schema: dv
        authentication: sql
        user: "${DBT_EWB_SQL_USER}"
        password: "${DBT_EWB_SQL_PASSWORD}"
        encrypt: true
        trust_cert: true
        query_timeout: 7200
  EOF

# =============================================================================
# STAGES
# =============================================================================
stages:
  - validate
  - deploy

# =============================================================================
# CI — Merge Request Validation (→ datavault-dev, compile + test only)
# =============================================================================
ci:validate:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  timeout: 30 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    - dbt compile --target ewb-dev
    # Slow RSN/CDR tests (tag:nightly) werden separat im ci:nightly-tests Job ausgeführt.
    # Sie scannen 9.4M+ Rows via External Tables und dauern je 50–150s.
    - dbt test --target ewb-dev --exclude tag:nightly
  environment:
    name: ewb-dev

# =============================================================================
# CI — Nightly Slow Tests (tag:nightly) auf ewb-dev
# RSN/CDR-Tests scannen 9.4M+ Rows via External Tables (50–150s pro Test).
# Läuft täglich via GitLab Schedule mit Variable NIGHTLY_TESTS=true.
# GitLab → Build → Schedules: Cron "0 2 * * *" (02:00 UTC), Branch: dev,
# Custom variable: NIGHTLY_TESTS = true
# =============================================================================
ci:nightly-tests:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_TESTS == "true"'
  timeout: 60 minutes
  script:
    - *setup_profiles
    - dbt test --target ewb-dev --select tag:nightly
  environment:
    name: ewb-dev

# =============================================================================
# DEPLOY DEV — push auf dev Branch (→ datavault-dev)
# =============================================================================
deploy:dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - models/**/*
        - macros/**/*
        - seeds/**/*
        - dbt_project.yml
        - packages.yml
    # Manuell aus Web-UI auf dev-Branch
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
  timeout: 3 hours
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    - dbt run --target ewb-dev
    - dbt test --target ewb-dev --exclude tag:nightly
  environment:
    name: ewb-dev

# =============================================================================
# DEPLOY DEV FULL REFRESH — manuell (→ datavault-dev, alle Tabellen neu)
# =============================================================================
deploy:dev:full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  timeout: 120 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    - dbt run --full-refresh --target ewb-dev
    - dbt test --target ewb-dev --exclude tag:nightly
  environment:
    name: ewb-dev

# =============================================================================
# CDR TELECOM LOAD DEV — inkrementell (→ datavault-dev)
# Manuell starten: lädt Services (Stammdaten) + neue CDR-Files aus ADF
# incoming/ in PSA → Vault → Mart.
# Reihenfolge: Services (hub_vertrag/kunde/sim) → CDR Events → Mart
# Nur für Files der letzten 2 Tage (Late-Arrival-Fenster der Faktentabellen).
# =============================================================================
deploy:dev:cdr-load:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  timeout: 60 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    # 1. Services (Stammdaten) — muss vor CDR-Events laufen
    - dbt run --select staging.rsn_mobile_services_main staging.rsn_mobile_services_optionen_dedup staging.rsn_mobile_services_kunde_dedup hub_vertrag hub_kunde sat_vertrag_optionen_ma__compax sat_vertrag_eff__compax sat_kunde__compax link_vertrag_kunde --target ewb-dev
    # 2. CDR Events — Staging View + PSA + Vault (hub_sim, hub_msisdn, link_cdr_event_tl, sat_cdr_event__compax)
    - dbt run --select staging.rsn_mobile_cdr_main staging.psa_rsn_mobile_cdr_main raw_vault.telecom --target ewb-dev
    # 3. Mart Aggregation
    - dbt run --select mart_telecom.fakt_datenvolumen mart_telecom.fakt_anrufe --target ewb-dev
    - dbt test --select mart.telecom --target ewb-dev
  environment:
    name: ewb-dev

# =============================================================================
# CDR TELECOM FULL REFRESH DEV — historischer Backfill (→ datavault-dev)
# Manuell starten: Faktentabellen vollständig neu aufbauen.
# Verwenden wenn historische Files (> 2 Tage alt) via ADF nachgeladen wurden.
# =============================================================================
deploy:dev:cdr-full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  timeout: 90 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    # 1. Services (Stammdaten)
    - dbt run --select staging.rsn_mobile_services_main staging.rsn_mobile_services_optionen_dedup staging.rsn_mobile_services_kunde_dedup hub_vertrag hub_kunde sat_vertrag_optionen_ma__compax sat_vertrag_eff__compax sat_kunde__compax link_vertrag_kunde --target ewb-dev
    # 2. CDR Events — Staging View + PSA + Vault
    - dbt run --select staging.rsn_mobile_cdr_main staging.psa_rsn_mobile_cdr_main raw_vault.telecom --target ewb-dev
    # 3. Mart Aggregation (full-refresh)
    - dbt run --select mart_telecom.fakt_datenvolumen mart_telecom.fakt_anrufe --full-refresh --target ewb-dev
    - dbt test --select mart.telecom --target ewb-dev
  environment:
    name: ewb-dev

# =============================================================================
# ISE / EDM LOAD DEV — inkrementell (→ datavault-dev)
# Manuell starten: laedt die i-SE-Energiedaten (¼-h-Lastgaenge + Zeitreihen-
# Stammdaten der Gruppe 150 "ewb_Power BI") aus stage-fs/ewb/ise/ in
# Staging → vault_ise → mart_ise.
#
# Voraussetzung: ADF-Pipeline CopyPipeline_Lastgaenge hat gelaufen (CSV → Parquet).
# Reihenfolge ergibt sich aus den refs; tag:ise umfasst Staging, Raw Vault UND
# Mart der Domaene.
#
# Hinweis: Diese Modelle laufen auch im regulaeren deploy:dev mit. Dieser Job
# ist fuer den Fall, dass nur die i-SE-Kette nachgezogen werden soll — etwa
# direkt nach einem ADF-Copy, ohne den ganzen Vault anzufassen.
# =============================================================================
deploy:dev:ise-load:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  timeout: 45 minutes
  script:
    - *setup_profiles
    # External Tables aktualisieren (ext_ise_lastgaenge / ext_ise_stammdaten)
    - dbt run-operation stage_external_sources --target ewb-dev
    # Staging → Raw Vault → Mart in einem Lauf (Reihenfolge via refs)
    - dbt run --select tag:ise --target ewb-dev
    - dbt test --select tag:ise --target ewb-dev
  environment:
    name: ewb-dev

# =============================================================================
# ISE / EDM FULL REFRESH DEV — Neuaufbau (→ datavault-dev)
# Manuell starten: baut vault_ise und mart_ise vollstaendig neu auf.
#
# Wann verwenden:
#   - nach einem Backfill-Export (aeltere Perioden nachgeladen)
#   - nach Aenderungen an Hashdiff-Zusammensetzung oder Payload
#   - nach Umbau der Ladelogik (z. B. Wechsel der Dedup-Regel)
#
# ACHTUNG: --full-refresh verwirft die Vault-Historie der i-SE-Objekte. Da alle
# Werte reproduzierbar aus dem Export stammen, ist das hier unkritisch —
# bei Quellen ohne vollstaendige Historie in der Landing Zone waere es NICHT
# unkritisch.
# =============================================================================
deploy:dev:ise-full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  timeout: 90 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-dev
    - dbt run --select tag:ise --full-refresh --target ewb-dev
    - dbt test --select tag:ise --target ewb-dev
  environment:
    name: ewb-dev

# =============================================================================
# DEPLOY TEST — push auf test Branch (→ datavault-test)
# =============================================================================
deploy:test:
  stage: deploy
  rules:
    # Push auf test → manuell (automatisch läuft deploy:test:adf-triggered)
    - if: '$CI_COMMIT_BRANCH == "test" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "test"'
      when: manual
  timeout: 90 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-test
    - dbt run --target ewb-test
    - dbt test --target ewb-test
  environment:
    name: ewb-test

# =============================================================================
# DEPLOY TEST — ADF-Trigger via load_status_pending_v (GitLab Schedule)
# Läuft alle 30 Min via GitLab Scheduled Pipeline auf Branch "test".
# Prüft vault.load_status_pending_v — startet dbt nur wenn dbt_run_pending=1.
# GitLab → Build → Schedules: "Every 30 min", Branch: test, Cron: */30 * * * *
# =============================================================================
deploy:test:adf-triggered:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "test"'
  resource_group: ewb-test-deploy
  interruptible: false
  timeout: 90 minutes
  script:
    - *setup_profiles
    - |
      set +e
      DBT_DATABASE=datavault-test python3 scripts/check_load_pending.py
      EXIT_CODE=$?
      set -e
      if [ $EXIT_CODE -eq 2 ]; then
        echo "dbt_run_pending=0 — kein neuer ADF-Load. Job beendet."
        exit 0
      elif [ $EXIT_CODE -ne 0 ]; then
        echo "Fehler beim Prüfen von vault.load_status_pending_v — Abbruch."
        exit 1
      fi
      echo "dbt_run_pending=1 — starte dbt run..."
      dbt run-operation stage_external_sources --target ewb-test
      dbt run --target ewb-test
      dbt test --target ewb-test
  environment:
    name: ewb-test

# =============================================================================
# DEPLOY TEST FULL REFRESH — manuell (→ datavault-test, alle Tabellen neu)
# =============================================================================
deploy:test:full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: manual
  timeout: 120 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-test
    - dbt run --full-refresh --target ewb-test
    - dbt test --target ewb-test
  environment:
    name: ewb-test

# =============================================================================
# CDR TELECOM LOAD TEST — inkrementell (→ datavault-test)
# Manuell starten: lädt Services (Stammdaten) + neue CDR-Files aus ADF
# incoming/ in PSA → Vault → Mart.
# Reihenfolge: Services (hub_vertrag/kunde/sim) → CDR Events → Mart
# =============================================================================
deploy:test:cdr-load:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: manual
  timeout: 60 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-test
    # 1. Services (Stammdaten) — muss vor CDR-Events laufen
    - dbt run --select staging.rsn_mobile_services_main staging.rsn_mobile_services_optionen_dedup staging.rsn_mobile_services_kunde_dedup hub_vertrag hub_kunde sat_vertrag_optionen_ma__compax sat_vertrag_eff__compax sat_kunde__compax link_vertrag_kunde --target ewb-test
    # 2. CDR Events — Staging View + PSA + Vault (hub_sim, hub_msisdn, link_cdr_event_tl, sat_cdr_event__compax)
    - dbt run --select staging.rsn_mobile_cdr_main staging.psa_rsn_mobile_cdr_main raw_vault.telecom --target ewb-test
    # 3. Mart Aggregation
    - dbt run --select mart_telecom.fakt_datenvolumen mart_telecom.fakt_anrufe --target ewb-test
    - dbt test --select mart.telecom --target ewb-test
  environment:
    name: ewb-test

# =============================================================================
# CDR TELECOM FULL REFRESH TEST — historischer Backfill (→ datavault-test)
# Manuell starten: Faktentabellen vollständig neu aufbauen.
# =============================================================================
deploy:test:cdr-full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: manual
  timeout: 90 minutes
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb-test
    # 1. Services (Stammdaten)
    - dbt run --select staging.rsn_mobile_services_main staging.rsn_mobile_services_optionen_dedup staging.rsn_mobile_services_kunde_dedup hub_vertrag hub_kunde sat_vertrag_optionen_ma__compax sat_vertrag_eff__compax sat_kunde__compax link_vertrag_kunde --target ewb-test
    # 2. CDR Events — Staging View + PSA + Vault
    - dbt run --select staging.rsn_mobile_cdr_main staging.psa_rsn_mobile_cdr_main raw_vault.telecom --target ewb-test
    # 3. Mart Aggregation (full-refresh)
    - dbt run --select mart_telecom.fakt_datenvolumen mart_telecom.fakt_anrufe --full-refresh --target ewb-test
    - dbt test --select mart.telecom --target ewb-test
  environment:
    name: ewb-test


deploy:prod:
  stage: deploy
  rules:
    # Tag-Push (z.B. v1.0.0) → automatisch
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
    # Manuell aus GitLab UI → nur auf main, manuell bestätigen
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  timeout: 90 minutes
  allow_failure: false
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb
    - dbt run --target ewb
    - dbt test --target ewb
  environment:
    name: ewb-prod

# =============================================================================
# DEPLOY PROD FULL REFRESH — nur manuell (→ datavault, alle Tabellen neu)
# =============================================================================
deploy:prod:full-refresh:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v/'
      when: manual
  timeout: 120 minutes
  allow_failure: false
  script:
    - *setup_profiles
    - dbt run-operation stage_external_sources --target ewb
    - dbt run --full-refresh --target ewb
    - dbt test --target ewb
  environment:
    name: ewb-prod
