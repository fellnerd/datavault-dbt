name: PR - dbt Validate

on:
  push:
    branches:
      - 'feature/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  validate:
    name: Validate dbt Models
    runs-on: [self-hosted, windows, dbt]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create profiles.yml
        shell: powershell
        run: |
          @"
          datavault:
            target: dev
            outputs:
              dev:
                type: sqlserver
                driver: 'ODBC Driver 17 for SQL Server'
                server: etl-test1
                database: VAULT
                schema: dv
                windows_login: true
                encrypt: false
                trust_cert: true
          "@ | Set-Content -Path "$env:DBT_PROFILES_DIR\profiles.yml" -Encoding UTF8

      - name: Validate connection
        shell: powershell
        run: dbt debug

      - name: Compile models
        id: compile
        shell: powershell
        continue-on-error: true
        run: dbt compile 2>&1 | Tee-Object -Variable compileOutput; exit $LASTEXITCODE

      - name: Run dbt tests
        id: tests
        shell: powershell
        continue-on-error: true
        run: dbt test 2>&1 | Tee-Object -Variable testOutput; exit $LASTEXITCODE

      - name: Generate validation summary
        if: always()
        shell: powershell
        run: |
          $compileResult = if ("${{ steps.compile.outcome }}" -eq "success") { "✅ Passed" } else { "❌ Failed" }
          $testResult = if ("${{ steps.tests.outcome }}" -eq "success") { "✅ Passed" } else { "❌ Failed" }

          # Parse run_results.json for detailed summary
          $details = ""
          if (Test-Path "target/run_results.json") {
            $runResults = Get-Content "target/run_results.json" -Raw | ConvertFrom-Json
            $total = $runResults.results.Count
            $passed = ($runResults.results | Where-Object { $_.status -in @("pass", "success") }).Count
            $warned = ($runResults.results | Where-Object { $_.status -eq "warn" }).Count
            $failed = ($runResults.results | Where-Object { $_.status -in @("fail", "error") }).Count
            $skipped = ($runResults.results | Where-Object { $_.status -eq "skipped" }).Count
            $elapsed = [math]::Round($runResults.elapsed_time, 2)

            $details = @"

          ### Test Results Detail
          | Status | Count |
          |--------|-------|
          | ✅ Passed | $passed |
          | ⚠️ Warnings | $warned |
          | ❌ Failed | $failed |
          | ⏭️ Skipped | $skipped |
          | **Total** | **$total** |

          ⏱️ Duration: ${elapsed}s
          "@

            # List warnings and failures
            $problems = $runResults.results | Where-Object { $_.status -in @("warn", "fail", "error") }
            if ($problems) {
              $details += "`n`n### Issues`n| Test | Status | Failures |`n|------|--------|----------|"
              foreach ($p in $problems) {
                $testName = ($p.unique_id -split '\.')[-1]
                $icon = if ($p.status -eq "warn") { "⚠️" } else { "❌" }
                $details += "`n| ``$testName`` | $icon $($p.status) | $($p.failures) |"
              }
            }
          }

          $summary = @"
          ## dbt Validation Report

          | Step | Result |
          |------|--------|
          | **dbt compile** | $compileResult |
          | **dbt test** | $testResult |
          $details

          - **Branch:** ``${{ github.ref_name }}``
          - **Commit:** ``${{ github.sha }}``
          - **Runner:** ``etl-test1``
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Fail if validation errors
        if: steps.compile.outcome == 'failure' || steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "dbt validation failed. Check compile and test steps above."
          exit 1
