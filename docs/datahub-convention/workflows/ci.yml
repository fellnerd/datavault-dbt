name: CI - dbt Validate & Deploy
# Manual workflow for validation and deployment to dev environment

on:
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Deploy models after validation (dbt run)'
        required: false
        default: false
        type: boolean
      full_refresh:
        description: 'Full refresh (recreate incremental tables)'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Run dbt tests after compile/deploy'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  validate:
    name: Validate dbt Project
    runs-on: [self-hosted, windows, dbt]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create profiles.yml
        shell: powershell
        run: |
          @"
          datavault:
            target: dev
            outputs:
              dev:
                type: sqlserver
                driver: 'ODBC Driver 17 for SQL Server'
                server: etl-test1
                database: VAULT
                schema: dv
                windows_login: true
                encrypt: false
                trust_cert: true
          "@ | Set-Content -Path "$env:DBT_PROFILES_DIR\profiles.yml" -Encoding UTF8

      - name: Validate connection
        shell: powershell
        run: dbt debug

      - name: Compile models
        shell: powershell
        run: dbt compile

      - name: Run dbt tests
        if: github.event.inputs.run_tests == 'true'
        shell: powershell
        run: dbt test

  deploy:
    name: Deploy dbt Models
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_deploy == 'true'
    runs-on: [self-hosted, windows, dbt]
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create profiles.yml
        shell: powershell
        run: |
          @"
          datavault:
            target: dev
            outputs:
              dev:
                type: sqlserver
                driver: 'ODBC Driver 17 for SQL Server'
                server: etl-test1
                database: VAULT
                schema: dv
                windows_login: true
                encrypt: false
                trust_cert: true
          "@ | Set-Content -Path "$env:DBT_PROFILES_DIR\profiles.yml" -Encoding UTF8

      - name: Run dbt models
        shell: powershell
        run: |
          $args = @("run", "--target", "dev")
          if ("${{ github.event.inputs.full_refresh }}" -eq "true") {
            $args += "--full-refresh"
          }
          & dbt @args

      - name: Run dbt tests
        shell: powershell
        run: dbt test --target dev

      - name: Generate deployment summary
        if: always()
        shell: powershell
        run: |
          $details = ""
          if (Test-Path "target/run_results.json") {
            $runResults = Get-Content "target/run_results.json" -Raw | ConvertFrom-Json
            $total = $runResults.results.Count
            $passed = ($runResults.results | Where-Object { $_.status -in @("pass", "success") }).Count
            $warned = ($runResults.results | Where-Object { $_.status -eq "warn" }).Count
            $failed = ($runResults.results | Where-Object { $_.status -in @("fail", "error") }).Count
            $elapsed = [math]::Round($runResults.elapsed_time, 2)

            $details = @"

          ### Test Results
          | Status | Count |
          |--------|-------|
          | ✅ Passed | $passed |
          | ⚠️ Warnings | $warned |
          | ❌ Failed | $failed |
          | **Total** | **$total** |

          ⏱️ Duration: ${elapsed}s
          "@
          }

          @"
          ## dbt Deployment Summary
          
          - **Target:** dev (etl-test1)
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Full Refresh:** ${{ github.event.inputs.full_refresh }}
          - **Triggered by:** ${{ github.actor }}
          $details
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
