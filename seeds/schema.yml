version: 2
seeds:
  - name: ref_issue_status
    description: Reference table for issue_status
    config:
      schema: vault
    columns:
      - name: status_id
        description: Primary Key - status_id
        tests:
          - unique
          - not_null
      - name: status_name
        description: status_name column
  - name: ref_role
    description: Referenzdaten für Unternehmens-Rollen (Client, Contractor, Supplier)
    config:
      schema: vault
    columns:
      - name: role_code
        description: Business Key - Eindeutiger Rollen-Code
        tests:
          - unique
          - not_null
      - name: role_name
        description: Anzeigename der Rolle
      - name: role_description
        description: Beschreibung der Rolle
