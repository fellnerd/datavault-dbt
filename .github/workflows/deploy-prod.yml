name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_stage_external:
        description: 'External Tables aktualisieren (stage_external_sources)'
        type: boolean
        default: true
      run_dbt_run:
        description: 'dbt run ausführen'
        type: boolean
        default: true
      run_dbt_test:
        description: 'dbt test ausführen'
        type: boolean
        default: true
      select:
        description: 'dbt --select Filter (leer = alle Modelle)'
        type: string
        default: ''

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  deploy-prod:
    name: Deploy → ewb (datavault)
    runs-on: [self-hosted, linux, dbt, aca]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Stage external sources
        if: ${{ github.event_name == 'push' || inputs.run_stage_external }}
        run: dbt run-operation stage_external_sources --target ewb

      - name: dbt run
        if: ${{ github.event_name == 'push' || inputs.run_dbt_run }}
        run: |
          SELECT="${{ inputs.select }}"
          if [ -n "$SELECT" ]; then
            dbt run --target ewb --select "$SELECT"
          else
            dbt run --target ewb
          fi

      - name: dbt test
        if: ${{ github.event_name == 'push' || inputs.run_dbt_test }}
        run: |
          SELECT="${{ inputs.select }}"
          if [ -n "$SELECT" ]; then
            dbt test --target ewb --select "$SELECT"
          else
            dbt test --target ewb
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deploy → ewb (Production)" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ewb (datavault) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag/Ref** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Select** | \`${{ inputs.select || '(alle)' }}\` |" >> $GITHUB_STEP_SUMMARY
