name: Setup dbt Environment
description: Install Python, dbt-sqlserver, and create profiles.yml with SQL auth

inputs:
  sql_user:
    required: true
  sql_password:
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-dbt-sqlserver-${{ runner.os }}-1.8
        restore-keys: pip-dbt-sqlserver-${{ runner.os }}-

    - name: Install dbt-sqlserver
      shell: bash
      run: pip install --quiet "dbt-sqlserver>=1.8,<2.0"

    - name: Create profiles.yml
      shell: bash
      env:
        SQL_USER: ${{ inputs.sql_user }}
        SQL_PASSWORD: ${{ inputs.sql_password }}
      run: |
        mkdir -p "${{ github.workspace }}"
        cat > "${{ github.workspace }}/profiles.yml" << EOF
        datavault:
          target: ewb-dev
          outputs:
            ewb-dev:
              type: sqlserver
              driver: 'ODBC Driver 18 for SQL Server'
              server: sql-analytics-ewb-001.database.windows.net
              port: 1433
              database: datavault-dev
              schema: dv
              authentication: sql
              user: "${SQL_USER}"
              password: "${SQL_PASSWORD}"
              encrypt: true
              trust_cert: false
              query_timeout: 7200
            ewb-test:
              type: sqlserver
              driver: 'ODBC Driver 18 for SQL Server'
              server: sql-analytics-ewb-001.database.windows.net
              port: 1433
              database: datavault-test
              schema: dv
              authentication: sql
              user: "${SQL_USER}"
              password: "${SQL_PASSWORD}"
              encrypt: true
              trust_cert: false
              query_timeout: 7200
            ewb:
              type: sqlserver
              driver: 'ODBC Driver 18 for SQL Server'
              server: sql-analytics-ewb-001.database.windows.net
              port: 1433
              database: datavault
              schema: dv
              authentication: sql
              user: "${SQL_USER}"
              password: "${SQL_PASSWORD}"
              encrypt: true
              trust_cert: false
              query_timeout: 7200
        EOF

    - name: Install dbt packages
      shell: bash
      run: dbt deps
      env:
        DBT_PROFILES_DIR: ${{ github.workspace }}
