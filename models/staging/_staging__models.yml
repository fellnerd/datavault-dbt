version: 2

models:
  # =============================================================================
  # ADVENTUREWORKS STAGING VIEWS
  # =============================================================================
  - name: adventureworks_customer
    description: Staging View für AdventureWorks Customer mit Hash-Berechnung
    columns:
      - name: hk_customer
        description: Hash Key (SHA256 von CustomerID)
        data_type: char(64)
        tests:
          - not_null
      - name: hd_customer
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: CustomerID
        description: Business Key
        data_type: int
        tests:
          - not_null
      - name: NameStyle
        description: Name Style Flag
        data_type: bit
      - name: Title
        description: Anrede
        data_type: nvarchar(4000)
      - name: FirstName
        description: Vorname
        data_type: nvarchar(4000)
      - name: MiddleName
        description: Mittelname
        data_type: nvarchar(4000)
      - name: LastName
        description: Nachname
        data_type: nvarchar(4000)
      - name: Suffix
        description: Namenszusatz
        data_type: nvarchar(4000)
      - name: CompanyName
        description: Firmenname
        data_type: nvarchar(4000)
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: Run ID
        data_type: nvarchar(4000)
