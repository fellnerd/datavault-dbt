  - name: psa_ewb_fibu_gl
    description: >
      PSA (Persistent Staging Area) für FIBU.GL — cached 944K Zeilen aus 12 PolyBase Parquet-Files
      (E15-E26) in einer lokalen SQL-Tabelle. Vermeidet wiederholte ADLS-Scans (~240M logical reads)
      beim Laden von sat_hauptbuch__abacus. Inkrementell via dss_load_date.
    config:
      meta:
        entity_type: psa
        source_type: external_table
        external_table: ext_ewb_fibu_gl
    columns:
      - name: RECNUM
        tests:
          - not_null
      - name: dss_source_file_name
        tests:
          - not_null
      - name: dss_load_date
        tests:
          - not_null

  - name: psa_ewb_fibu_gl_rolling
    description: >
      Rolling-Filter View auf psa_ewb_fibu_gl — liefert nur GL-Einträge ab 01.01. des letzten Kalenderjahrs.
      WHERE DATE >= CAST(DATEFROMPARTS(YEAR(GETDATE()) - 1, 1, 1) AS DATETIME2)
      Beispiel: am 01.06.2026 → ab 01.01.2025; am 01.01.2027 → ab 01.01.2026.
      Zweck: ewb_fibu_gl TABLE-Rebuild von ~673s auf ~100-150s reduzieren (nur ~2 statt 12 Jahresscheiben).
      Risiko: GL-Korrekturen vor letztem Jahr nicht im normalen Run. Jährlich full-refresh ausführen.
    config:
      meta:
        entity_type: filter_view
        source: psa_ewb_fibu_gl

  - name: ewb_fibu_gl
    description: >
      Staging view for FIBU.GL (Hauptbuch) — Folder-Scan aller Jahresscheiben E22-E26+.
      BK: RECNUM (unique row identifier). DKBELEGNUMMER+KTO ist NICHT unique (62% Nullen, bis zu 96 Duplikate).
      ~890.000 Buchungszeilen über alle Jahresscheiben.
    config:
      meta:
        entity_type: standard
        source_type: external_table
        external_table: ext_ewb_fibu_gl
        business_keys:
          - RECNUM
    columns:
      - name: hk_hauptbuch
        description: >
          Hash Key basierend auf RECNUM (unique row identifier).
          BK-Entscheidung 29.3.2026: DKBELEGNUMMER+KTO nicht unique → RECNUM als alleiniger BK.
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hd_hauptbuch
        description: Hash Diff for change detection (178 Payload-Spalten)
        data_type: char(64)
        tests:
          - not_null
      - name: hk_buchungskopf
        description: Hash Key FK → hub_buchungskopf (DKBELEGNUMMER = FHE.RECNUM)
        data_type: char(64)
      - name: hk_kreditor
        description: Hash Key FK → hub_kreditor (DKKUNDENNUMMER)
        data_type: char(64)
      - name: hk_konto
        description: Hash Key FK → hub_konto Ghost Hub (KTO)
        data_type: char(64)
      - name: hk_kostenstelle
