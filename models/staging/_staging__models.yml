  - name: werkportal_contact
    description: |
      Staging view for contact from werkportal.
      Contact is a Dependent Child (DC) of Contractor - it has no own Hub.
      Key columns: hk_contractor (FK), hk_link_contact_contractor (Link Key)
    columns:
      - name: hk_contractor
        description: FK Hash Key to hub_contractor
        data_type: char(64)
        tests:
          - not_null
      - name: hk_link_contact_contractor
        description: Link Hash Key (DC pattern - includes DCK columns)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hd_contact
        description: Hash Diff for change detection
        data_type: char(64)
        tests:
          - not_null
      - name: hd_contact_contractor_dc
        description: Hash Diff for DC Satellite (contact attributes under contractor)
        data_type: char(64)
        tests:
          - not_null
      - name: date_created
        description: Payload attribute
      - name: date_updated
        description: Payload attribute
      - name: subscription
        description: Payload attribute
      - name: name
        description: DCK column (part of link hash)
      - name: state
        description: Payload attribute
      - name: title
        description: Payload attribute
      - name: email1
        description: DCK column (part of link hash)
      - name: email2
        description: Payload attribute
      - name: mobile1
        description: Payload attribute
      - name: mobile2
        description: Payload attribute
      - name: phone
        description: Payload attribute
      - name: fax
        description: Payload attribute
      - name: contact_function_name
        description: Payload attribute
      - name: company_supplier
        description: Payload attribute
      - name: company_client
        description: Payload attribute
      - name: company_contractor
        description: Payload attribute
      - name: contact_function_id
        description: Payload attribute
      - name: dss_record_source
        description: Data source identifier
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: Load timestamp
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: dbt run identifier
