version: 2
models:
  - name: adventureworks_customer
    description: Staging View für AdventureWorks Customer mit Hash-Berechnung
    columns:
      - name: hk_customer
        description: Hash Key (SHA256 von CustomerID)
        data_type: char(64)
        tests:
          - not_null
      - name: hd_customer
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: CustomerID
        description: Business Key
        data_type: int
        tests:
          - not_null
      - name: NameStyle
        description: Name Style Flag
        data_type: bit
      - name: Title
        description: Anrede
        data_type: nvarchar(4000)
      - name: FirstName
        description: Vorname
        data_type: nvarchar(4000)
      - name: MiddleName
        description: Mittelname
        data_type: nvarchar(4000)
      - name: LastName
        description: Nachname
        data_type: nvarchar(4000)
      - name: Suffix
        description: Namenszusatz
        data_type: nvarchar(4000)
      - name: CompanyName
        description: Firmenname
        data_type: nvarchar(4000)
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: Run ID
        data_type: nvarchar(4000)
  - name: jira_comments
    description: Staging view for Jira Comments (Dependent Child of Issue)
    columns:
      - name: hk_issue
        description: FK Hash Key to parent hub_issue
        data_type: char(64)
        tests:
          - not_null
      - name: hk_link_comment_issue
        description: Link Hash Key (FK + DCK)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hd_comment_issue_dc
        description: Hash Diff for DC Satellite
        data_type: char(64)
        tests:
          - not_null
      - name: issue_key
        description: FK to parent issue
        tests:
          - not_null
      - name: comment_author
        description: DCK - Comment author
      - name: comment_date
        description: DCK - Comment timestamp
      - name: comment_text
        description: Payload - Comment content
      - name: dss_record_source
        description: Data source identifier
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: Load timestamp
        data_type: datetime2(7)
        tests:
          - not_null
  - name: jira_comments_seed
    description: Staging view for comments_seed from jira
    columns:
      - name: hk_comments_seed
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hk_vorgang
        description: Foreign Key to hub_vorgang
        data_type: char(64)
        tests:
          - not_null
      - name: hd_comments_seed
        description: Hash Diff for change detection
        data_type: char(64)
        tests:
          - not_null
      - name: issue_id
        description: Business Key
        tests:
          - not_null
      - name: comment_author
        description: Business Key
        tests:
          - not_null
      - name: comment_date
        description: Business Key
        tests:
          - not_null
      - name: issue_key
        description: Payload attribute
      - name: comment_text
        description: Payload attribute
      - name: dss_record_source
        description: Data source identifier
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: Load timestamp
        data_type: datetime2(7)
        tests:
          - not_null
  - name: jira_project
