version: 2

models:
  # =============================================================================
  # ADVENTUREWORKS STAGING VIEWS
  # =============================================================================
  - name: adventureworks_customer
    description: Staging View für AdventureWorks Customer mit Hash-Berechnung
    columns:
      - name: hk_customer
        description: Hash Key (SHA256 von CustomerID)
        data_type: char(64)
        tests:
          - not_null
      - name: hd_customer
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: CustomerID
        description: Business Key
        data_type: int
        tests:
          - not_null
      - name: NameStyle
        description: Name Style Flag
        data_type: bit
      - name: Title
        description: Anrede
        data_type: nvarchar(4000)
      - name: FirstName
        description: Vorname
        data_type: nvarchar(4000)
      - name: MiddleName
        description: Mittelname
        data_type: nvarchar(4000)
      - name: LastName
        description: Nachname
        data_type: nvarchar(4000)
      - name: Suffix
        description: Namenszusatz
        data_type: nvarchar(4000)
      - name: CompanyName
        description: Firmenname
        data_type: nvarchar(4000)
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: Run ID
        data_type: nvarchar(4000)

  # =============================================================================
  # WERKPORTAL STAGING VIEWS
  # =============================================================================
  - name: werkportal_company
    description: |
      Unified Staging View für alle Company-Typen (Client, Contractor).
      Kombiniert ext_company_client und ext_company_contractor mit role_code.
    columns:
      - name: hk_company
        description: Hash Key (SHA256 von object_id + source_table)
        data_type: char(64)
        tests:
          - not_null
      - name: hk_country
        description: Hash Key für Länder-Referenz
        data_type: char(64)
      - name: hk_role
        description: Hash Key für Rollen-Referenz
        data_type: char(64)
      - name: hk_link_company_role
        description: Hash Key für Link Company-Role
        data_type: char(64)
      - name: hk_link_company_country
        description: Hash Key für Link Company-Country
        data_type: char(64)
      - name: hd_company
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: object_id
        description: Business Key aus Quellsystem
        data_type: bigint
        tests:
          - not_null
      - name: source_table
        description: Quelltabelle (ext_company_client/ext_company_contractor)
        data_type: varchar(21)
        tests:
          - not_null
      - name: role_code
        description: Rolle (CLIENT, CONTRACTOR)
        data_type: varchar(10)
        tests:
          - not_null
          - accepted_values:
              values: ['CLIENT', 'CONTRACTOR']
      - name: name
        description: Firmenname
        data_type: nvarchar(4000)
      - name: street
        description: Straße
        data_type: nvarchar(4000)
      - name: citycode
        description: Postleitzahl
        data_type: nvarchar(4000)
      - name: city
        description: Stadt
        data_type: nvarchar(4000)
      - name: province
        description: Bundesland/Provinz
        data_type: nvarchar(4000)
      - name: state
        description: Status
        data_type: nvarchar(4000)
      - name: country
        description: Land (FK zu wp_country)
        data_type: bigint
      - name: website
        description: Website URL
        data_type: nvarchar(4000)
      - name: email
        description: E-Mail Adresse
        data_type: nvarchar(4000)
      - name: phone
        description: Telefonnummer
        data_type: nvarchar(4000)
      - name: mobile
        description: Mobilnummer
        data_type: nvarchar(4000)
      - name: mobile2
        description: Zweite Mobilnummer
        data_type: nvarchar(4000)
      - name: fax
        description: Faxnummer
        data_type: nvarchar(4000)
      - name: bic
        description: BIC Code
        data_type: nvarchar(4000)
      - name: iban
        description: IBAN
        data_type: nvarchar(4000)
      - name: credit_rating
        description: Kreditwürdigkeit
        data_type: nvarchar(4000)
      - name: commission_fee
        description: Provisionsgebühr
        data_type: nvarchar(4000)
      - name: employeecount
        description: Mitarbeiteranzahl
        data_type: numeric(38,0)
      - name: org_type
        description: Organisationstyp
        data_type: bigint
      - name: uid
        description: Umsatzsteuer-ID
        data_type: nvarchar(4000)
      - name: subscription
        description: Subscription
        data_type: nvarchar(4000)
      - name: description
        description: Beschreibung
        data_type: nvarchar(4000)
      - name: freistellungsbescheinigung
        description: Datum Freistellungsbescheinigung
        data_type: datetime2(7)
      - name: date_created
        description: Erstellungsdatum
        data_type: datetime2(7)
      - name: date_updated
        description: Aktualisierungsdatum
        data_type: datetime2(7)
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: Run ID
        data_type: nvarchar(4000)

