  - name: adworks_verkauf
    description: Staging view for verkauf from adworks
    config:
      meta:
        entity_type: standard
        source_type: external_table
        external_table: ext_adventureworks_saleslt_salesorderheader
        business_keys:
          - SALESORDERID
        foreign_keys:
          - column: customerid
            target_entity: kunde
            target_hub: adworks.hub_kunde
          - column: shiptoaddressid
