        description: Payload attribute
      - name: purchaseordernumber
        description: Payload attribute
      - name: accountnumber
        description: Payload attribute
      - name: shipmethod
        description: Payload attribute
      - name: creditcardapprovalcode
        description: Payload attribute
      - name: subtotal
        description: Payload attribute
      - name: taxamt
        description: Payload attribute
      - name: freight
        description: Payload attribute
      - name: totaldue
        description: Payload attribute
      - name: comment
        description: Payload attribute
      - name: modifieddate
        description: Payload attribute
      - name: dss_record_source
        description: Data source identifier
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: Load timestamp
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: dbt run identifier
  - name: adworks_verkauf_detail
    description: Staging view for verkauf_detail from adworks
    config:
      meta:
        entity_type: standard
        source_type: external_table
        external_table: ext_adventureworks_saleslt_salesorderdetail
        foreign_keys:
          - column: salesorderid
            target_entity: verkauf
            target_hub: adworks.hub_verkauf
          - column: productid
            target_entity: produkt
            target_hub: adworks.hub_produkt
        dependent_child_keys:
          adworks.hub_verkauf:
            - salesorderdetailid
    columns:
      - name: hk_verkauf_detail
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hk_verkauf
        description: Foreign Key to hub_verkauf
        data_type: char(64)
        tests:
          - not_null
      - name: hk_produkt
        description: Foreign Key to hub_produkt
        data_type: char(64)
        tests:
          - not_null
      - name: hd_verkauf_detail
        description: Hash Diff for change detection
        data_type: char(64)
        tests:
          - not_null
      - name: salesorderdetailid
        description: Payload attribute
      - name: orderqty
        description: Payload attribute
      - name: unitprice
        description: Payload attribute
      - name: unitpricediscount
        description: Payload attribute
      - name: linetotal
        description: Payload attribute
      - name: modifieddate
        description: Payload attribute
      - name: dss_record_source
        description: Data source identifier
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: Load timestamp
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_run_id
        description: dbt run identifier
  - name: psa_adventureworks_saleslt_address
    description: |-
      Persistent Staging Area for saleslt_address.
      Source: ext_adventureworks_saleslt_address
      Strategy: merge
    columns:
      - name: AddressID
        description: AddressID
        data_type: int
        tests:
          - not_null
      - name: AddressLine1
        description: AddressLine1
        data_type: nvarchar(4000)
      - name: AddressLine2
        description: AddressLine2
        data_type: nvarchar(4000)
      - name: City
        description: City
        data_type: nvarchar(4000)
      - name: StateProvince
        description: StateProvince
        data_type: nvarchar(4000)
      - name: CountryRegion
        description: CountryRegion
        data_type: nvarchar(4000)
      - name: PostalCode
        description: PostalCode
        data_type: nvarchar(4000)
      - name: rowguid
        description: rowguid
        data_type: nvarchar(4000)
      - name: ModifiedDate
        description: ModifiedDate
        data_type: datetime2
      - name: dss_record_source
        description: dss_record_source
        data_type: nvarchar(4000)
      - name: dss_load_date
        description: dss_load_date
        data_type: nvarchar(4000)
      - name: dss_run_id
        description: dss_run_id
        data_type: nvarchar(4000)
      - name: dss_stage_timestamp
        description: dss_stage_timestamp
        data_type: nvarchar(4000)
      - name: dss_source_file_name
        description: dss_source_file_name
        data_type: nvarchar(4000)

