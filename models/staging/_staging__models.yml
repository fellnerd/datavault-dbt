  # ===== RSN Mobile (Compax RSN — Rii Seez Net) =====

  - name: rsn_mobile_services_main
    description: >
      Staging view für RSN Mobile Stammdaten (Compax RSN Abos & Optionen).
      Quelle: ext_rsn_mobile_services_main (Folder-Scan ewb/cdr/services/).
      Erzeugt Hash Keys für 4 Hubs (vertrag, kunde, sim, msisdn), 3 Link-Keys und 3 Hashdiffs.
      Record Source override: rsn_compax (ADF-Lieferung aktuell fehlerhaft).
    config:
      tags: [nightly]
      meta:
        entity_type: standard
        source_type: external_table
        external_table: ext_rsn_mobile_services_main
        business_keys:
          - vertrags_nummer
          - customer_id
          - icc
          - rufnummer
    columns:
      - name: hk_vertrag
        description: "Hash Key → hub_vertrag (vertrag_id ← vertrags_nummer)"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_kunde
        description: "Hash Key → hub_kunde (kunde_id ← customer_id)"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_sim
        description: "Hash Key → hub_sim (icc). NULL erlaubt: Compax liefert legitim Verträge ohne SIM-Hardware (z.B. virtuelle Verträge); hub_sim filtert NULL-BKs automatisch."
        data_type: char(64)
        tests:
          - not_null:
              severity: warn
      - name: hk_msisdn
        description: "Hash Key → hub_msisdn (rufnummer). NULL erlaubt: Compax liefert legitim Verträge ohne Rufnummer; hub_msisdn filtert NULL-BKs automatisch."
        data_type: char(64)
        tests:
          - not_null:
              severity: warn
      - name: hk_link_vertrag_kunde
        description: "Link Hash Key — vertrag ↔ kunde"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_link_vertrag_sim
        description: "Link Hash Key — vertrag ↔ sim"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_link_vertrag_msisdn
        description: "Link Hash Key — vertrag ↔ msisdn"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_adresse
        description: "Hash Key → hub_adresse (adresse_bk ← external_customer_id normalisiert auf DECIMAL(38,18)-Format)"
        data_type: char(64)
      - name: hk_link_kunde_adresse
        description: "Link Hash Key — kunde ↔ adresse (Hash(kunde_id, adresse_bk))"
        data_type: char(64)
      - name: hd_kunde
        description: "Hash Diff → sat_kunde__compax (external_customer_id)"
        data_type: char(64)
        tests:
          - not_null
      - name: hd_vertrag_optionen_ma
        description: "Hash Diff → sat_vertrag_optionen_ma__compax (aktivierungs_datum, ist_option, kundigungs_datum, mlz_datum)"
        data_type: char(64)
        tests:
          - not_null
      - name: hd_vertrag_eff
        description: "Hash Diff → sat_vertrag_eff__compax (is_active = derived literal '1')"
        data_type: char(64)
        tests:
          - not_null
      - name: vertrag_id
        description: "Derived alias von vertrags_nummer (BK für hub_vertrag)"
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: kunde_id
        description: "Derived alias von customer_id (BK für hub_kunde)"
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: vertrags_nummer
        description: "Quell-Business Key — Vertragsnummer"
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: customer_id
        description: "Compax Kunden-ID (BK für hub_kunde)"
        data_type: nvarchar(4000)
      - name: external_customer_id
        description: "Externe Kunden-ID (Payload sat_kunde)"
        data_type: nvarchar(4000)
      - name: abo_option_name
        description: "Abo- oder Options-Name"
        data_type: nvarchar(4000)
      - name: rufnummer
        description: "Rufnummer (MSISDN — BK für hub_msisdn)"
        data_type: nvarchar(4000)
      - name: icc
        description: "ICC-Nummer / SIM-Karte (BK für hub_sim)"
        data_type: nvarchar(4000)
      - name: aktivierungs_datum
        description: "Aktivierungsdatum (als String, Payload)"
        data_type: nvarchar(4000)
      - name: kundigungs_datum
        description: "Kündigungsdatum (als String, nullable, Payload)"
        data_type: nvarchar(4000)
      - name: mlz_datum
        description: "MLZ-Datum (als String, nullable, Payload)"
        data_type: nvarchar(4000)
      - name: ist_option
        description: "Flag '0'/'1' — ist Option (Payload)"
        data_type: nvarchar(4000)
      - name: is_active
        description: "Derived Literal '1' — immer aktiv (Payload sat_vertrag_eff)"
        data_type: nvarchar(1)
      - name: dss_record_source
        description: "Data source identifier (rsn_compax)"
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        description: "Load timestamp"
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_create_datetime
        description: "dbt processing timestamp"
        data_type: datetime2(7)
      - name: dss_business_key_vertrag
        description: "Concatenated business key string — Vertrag"
        data_type: nvarchar(4000)
      - name: dss_business_key_kunde
        description: "Concatenated business key string — Kunde"
        data_type: nvarchar(4000)
      - name: dss_business_key_sim
        description: "Concatenated business key string — SIM"
        data_type: nvarchar(4000)
      - name: dss_business_key_msisdn
        description: "Concatenated business key string — MSISDN"
        data_type: nvarchar(4000)
      - name: adresse_bk
        description: "Normalisierter Adress-BK: CAST(TRY_CAST(external_customer_id AS DECIMAL(38,18)) AS NVARCHAR(MAX)) — für Hash-Kompatibilität mit hub_adresse.INR. CXL_-Prefix wird bereinigt. NULL wenn nicht castbar."
        data_type: nvarchar(max)

  - name: rsn_mobile_services_optionen_dedup
    description: >
      Dedupliziertes Zwischen-Modell für sat_vertrag_optionen_ma__compax.
      rsn_mobile_services_main hat N Zeilen pro (vertrags_nummer, abo_option_name).
      automate_dv.ma_sat() verwendet RANK() — bei gleicher dss_load_date bekommen
      alle N Zeilen RANK=1 → alle werden inserted → Duplikate (z.B. Xtra-Card Watch 9×).
      Dieses Modell liefert exakt eine Zeile pro (hk_vertrag, abo_option_name, hd_vertrag_optionen_ma).
    config:
      tags: [nightly]
      meta:
        entity_type: dedup
        source_type: staging_view
    columns:
      - name: hk_vertrag
        description: "Hash Key → hub_vertrag"
        data_type: char(64)
        tests:
          - not_null
      - name: abo_option_name
        description: "CDK (Composite Dependent Key) — Name der Option"
        data_type: nvarchar(4000)
        tests:
          - not_null
      - name: hd_vertrag_optionen_ma
        description: "Hash Diff für sat_vertrag_optionen_ma__compax"
        data_type: char(64)
        tests:
          - not_null
      - name: ist_option
        data_type: nvarchar(4000)
      - name: aktivierungs_datum
        data_type: nvarchar(4000)
      - name: kundigungs_datum
        data_type: nvarchar(4000)
      - name: mlz_datum
        data_type: nvarchar(4000)
      - name: dss_record_source
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_create_datetime
        data_type: datetime2(7)

  - name: rsn_mobile_services_kunde_dedup
    description: >
      Dedupliziertes Zwischen-Modell für sat_kunde__compax.
      rsn_mobile_services_main hat eine Zeile pro Vertrag (N Verträge pro Kunde).
      automate_dv.sat() verwendet RANK() statt ROW_NUMBER() — bei gleicher dss_load_date
      bekommen alle N Zeilen RANK=1 → alle N werden inserted → Duplikate.
      Dieses Modell liefert exakt eine Zeile pro (hk_kunde, hd_kunde) an den Satelliten.
    config:
      tags: [nightly]
      meta:
        entity_type: dedup
        source_type: staging_view
    columns:
      - name: hk_kunde
        description: "Hash Key → hub_kunde"
        data_type: char(64)
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: hk_adresse
        description: "Hash Key → hub_adresse (adresse_bk = external_customer_id normalisiert, NULL wenn nicht castbar)"
        data_type: char(64)
      - name: hk_link_kunde_adresse
        description: "Link Hash Key → link_kunde_adresse (Hash(kunde_id, adresse_bk), NULL wenn adresse_bk NULL)"
        data_type: char(64)
      - name: hd_kunde
        description: "Hash Diff für sat_kunde__compax (external_customer_id)"
        data_type: char(64)
        tests:
          - not_null
      - name: external_customer_id
        description: "Externe Kunden-ID (Payload sat_kunde)"
        data_type: nvarchar(4000)
      - name: dss_record_source
        data_type: varchar(100)
        tests:
          - not_null
      - name: dss_load_date
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_create_datetime
        data_type: datetime2(7)
      - name: dss_business_key_kunde
        data_type: nvarchar(4000)

  - name: psa_rsn_mobile_cdr_main
    description: >
      PSA (Persistent Staging Area) für RSN Mobile CDR Events— gecachte Verbindungsdaten
      (Call, Data, SMS) aus ADLS in einer lokalen SQL-Tabelle. Folder-Scan über ewb/cdr/udrs/.
      Inkrementell per dss_source_file_name: bereits geladene Dateien werden übersprungen.
      Vermeidet wiederholte teure PolyBase-Scans über alle UDR-Files.
    config:
      tags: [nightly]
      meta:
        entity_type: psa
        source_type: external_table
        external_table: ext_rsn_mobile_cdr_main
    columns:
      - name: id
        description: "CDR Event ID (BK)"
        tests:
          - not_null
      - name: dss_source_file_name
        description: "Quelldatei-Name (für inkrementelle Steuerung)"
        tests:
          - not_null
      - name: dss_load_date
        description: "Load timestamp"
        tests:
          - not_null
      - name: contract_id
        description: "Vertrags-ID (FK → hub_vertrag)"
      - name: iccid
        description: "ICC-ID der SIM-Karte (FK → hub_sim)"
      - name: signaling_start
        description: "Signalisierungsstart"
      - name: connection_start
        description: "Verbindungsstart"
      - name: duration
        description: "Dauer in Sekunden"
      - name: call_type
        description: "Anruftyp"
      - name: service_type
        description: "Service-Typ (Voice, Data, SMS)"
      - name: price
        description: "Preis"
      - name: dss_create_datetime
        description: "dbt processing timestamp"

  - name: rsn_mobile_cdr_delta
    description: >
      Hochwassermarke (High-Water Mark) Filter-View auf psa_rsn_mobile_cdr_main.
      Liefert nur PSA-Rows die NEUER sind als der letzte Stand in vault_telecom.sat_cdr_event__compax.
      Wenn keine neuen CDR-Files vorliegen → 0 Rows → Vault-Modelle in Sekunden fertig.
      OBJECT_ID()-Check sichert Full-Refresh-Kompatibilität (fällt auf 1900-01-01 zurück).
      Zwischenstufe für rsn_mobile_cdr_main (source_model).
    config:
      tags: [cdr, nightly]

  - name: rsn_mobile_cdr_main
    description: >
      Staging view für RSN Mobile CDR Events (Call Detail Records).
      Quelle: rsn_mobile_cdr_delta (HWM-gefilterter View auf PSA — nur neue Rows seit letztem Vault-Load).
      Hash Keys: hk_vertrag (contract_id), hk_sim (iccid), hk_link_cdr_event_tl (id, vertrag_id, icc).
      Transaction Link Pattern — jede CDR-Zeile ist ein Event.
    config:
      tags: [nightly, cdr]
      meta:
        entity_type: standard
        source_type: psa_table
        external_table: ext_rsn_mobile_cdr_main
        business_keys:
          - id
    columns:
      - name: hk_vertrag
        description: "Hash Key → hub_vertrag (vertrag_id ← contract_id)"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_sim
        description: "Hash Key → hub_sim (icc ← iccid)"
        data_type: char(64)
        tests:
          - not_null
      - name: hk_link_cdr_event_tl
        description: "Transaction Link Hash Key — CDR Event (id, vertrag_id, icc)"
        data_type: char(64)
        tests:
