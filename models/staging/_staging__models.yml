version: 2
models:
  - name: jira_project
    description: Staging view for project from jira
    columns:
      - name: hk_project
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hd_project
        description: Hash Diff for change detection
        data_type: char(64)
        tests:
          - not_null
      - name: PROJECT_ID
        description: Business Key
        tests:
          - not_null
      - name: PROJECT_KEY
        description: Payload attribute
      - name: NAME
        description: Payload attribute
      - name: URL
        description: Payload attribute
