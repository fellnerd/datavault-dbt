version: 2

# =============================================================================
# ROOT SCHEMA.YML
# =============================================================================
# Diese Datei enthält nur noch Seeds und projekt-übergreifende Definitionen.
# Model-Definitionen sind in den jeweiligen Layer-Ordnern:
#
#   - models/staging/_staging__models.yml
#   - models/raw_vault/werkportal/_werkportal__models.yml
#   - models/raw_vault/adventureworks/_adventureworks__models.yml
#   - models/business_vault/_business_vault__models.yml
#   - models/mart/_common/_common__models.yml
#   - models/mart/project/_project__models.yml
#
# =============================================================================

seeds:
  - name: ref_role
    description: |
      Referenztabelle für Company-Rollen (CLIENT, CONTRACTOR, SUPPLIER).
      Wird als statische Lookup-Tabelle im Data Vault verwendet.
    columns:
      - name: role_code
        description: Rolle Code (Primary Key)
        data_type: varchar(20)
        tests:
          - not_null
          - unique
      - name: role_name
        description: Anzeigename der Rolle
        data_type: varchar(50)
      - name: role_description
        description: Beschreibung der Rolle
        data_type: varchar(200)
      - name: hk_role
        description: Hash Key für Data Vault Integration
        data_type: char(64)
