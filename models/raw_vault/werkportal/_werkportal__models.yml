version: 2

models:
  # =============================================================================
  # HUBS
  # =============================================================================
  - name: hub_company
    description: |
      Hub für alle Unternehmen aus Werkportal.
      Kombiniert Client und Contractor Companies.
    columns:
      - name: hk_company
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: object_id
        description: Business Key aus Quellsystem
        data_type: bigint
        tests:
          - not_null
      - name: source_table
        description: Quelltabelle (ext_company_client/ext_company_contractor)
        data_type: varchar(21)
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  - name: hub_country
    description: Hub für Länder aus Werkportal
    columns:
      - name: hk_country
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: object_id
        description: Business Key
        data_type: bigint
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  - name: hub_invoice
    description: Hub für Rechnungen aus Werkportal
    columns:
      - name: hk_invoice
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: object_id
        description: Business Key
        data_type: bigint
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  - name: hub_project
    description: Hub für Projekte aus Werkportal
    columns:
      - name: hk_project
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: object_id
        description: Business Key
        data_type: bigint
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  # =============================================================================
  # SATELLITES
  # =============================================================================
  - name: sat_company
    description: |
      Satellite mit allen beschreibenden Attributen für Companies.
      Enthält Adress-, Kontakt- und Geschäftsdaten.
    columns:
      - name: hk_company
        description: Hash Key (FK zu hub_company)
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_company')
              field: hk_company
      - name: hd_company
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: name
        description: Firmenname
        data_type: nvarchar(4000)
      - name: subscription
        description: Subscription
        data_type: nvarchar(4000)
      - name: org_type
        description: Organisationstyp
        data_type: bigint
      - name: uid
        description: Umsatzsteuer-ID
        data_type: nvarchar(4000)
      - name: description
        description: Beschreibung
        data_type: nvarchar(4000)
      - name: street
        description: Straße
        data_type: nvarchar(4000)
      - name: citycode
        description: Postleitzahl
        data_type: nvarchar(4000)
      - name: city
        description: Stadt
        data_type: nvarchar(4000)
      - name: province
        description: Bundesland/Provinz
        data_type: nvarchar(4000)
      - name: state
        description: Status
        data_type: nvarchar(4000)
      - name: country
        description: Land FK
        data_type: bigint
      - name: website
        description: Website URL
        data_type: nvarchar(4000)
      - name: email
        description: E-Mail Adresse
        data_type: nvarchar(4000)
      - name: phone
        description: Telefonnummer
        data_type: nvarchar(4000)
      - name: mobile
        description: Mobilnummer
        data_type: nvarchar(4000)
      - name: mobile2
        description: Zweite Mobilnummer
        data_type: nvarchar(4000)
      - name: fax
        description: Faxnummer
        data_type: nvarchar(4000)
      - name: bic
        description: BIC Code
        data_type: nvarchar(4000)
      - name: iban
        description: IBAN
        data_type: nvarchar(4000)
      - name: credit_rating
        description: Kreditwürdigkeit
        data_type: nvarchar(4000)
      - name: commission_fee
        description: Provisionsgebühr
        data_type: nvarchar(4000)
      - name: employeecount
        description: Mitarbeiteranzahl
        data_type: numeric(38,0)
      - name: freistellungsbescheinigung
        description: Datum Freistellungsbescheinigung
        data_type: datetime2(7)
      - name: date_created
        description: Erstellungsdatum
        data_type: datetime2(7)
      - name: date_updated
        description: Aktualisierungsdatum
        data_type: datetime2(7)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null

  - name: sat_company_client_ext
    description: Satellite mit erweiterten Client-spezifischen Attributen
    columns:
      - name: hk_company
        description: Hash Key (FK zu hub_company)
        data_type: char(64)
        tests:
          - not_null
      - name: hd_company_client
        description: Hash Diff
        data_type: char(64)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)

  - name: sat_country
    description: Satellite mit Länder-Attributen
    columns:
      - name: hk_country
        description: Hash Key (FK zu hub_country)
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_country')
              field: hk_country
      - name: hd_country
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: name
        description: Ländername
        data_type: nvarchar(4000)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null

  - name: sat_invoice
    description: Satellite mit Rechnungs-Attributen
    columns:
      - name: hk_invoice
        description: Hash Key (FK zu hub_invoice)
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_invoice')
              field: hk_invoice
      - name: hd_invoice
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: name
        description: Rechnungsnummer
        data_type: nvarchar(4000)
      - name: state
        description: Status
        data_type: nvarchar(4000)
      - name: deductions_description
        description: Abzugsbeschreibung
        data_type: nvarchar(4000)
      - name: gross
        description: Brutto Flag
        data_type: bit
      - name: invoicing_period_year
        description: Abrechnungsjahr
        data_type: numeric(38,18)
      - name: project
        description: Projekt FK
        data_type: bigint
      - name: invoice_date
        description: Rechnungsdatum
        data_type: datetime2(7)
      - name: date_payed
        description: Zahlungsdatum
        data_type: datetime2(7)
      - name: description
        description: Beschreibung
        data_type: nvarchar(4000)
      - name: advance_payment
        description: Vorauszahlung Flag
        data_type: bit
      - name: date_payed_internally
        description: Internes Zahlungsdatum
        data_type: datetime2(7)
      - name: payed
        description: Bezahlt Status
        data_type: nvarchar(4000)
      - name: contractor
        description: Auftragnehmer FK
        data_type: bigint
      - name: client
        description: Auftraggeber FK
        data_type: bigint
      - name: sum_goal
        description: Zielbetrag
        data_type: numeric(38,18)
      - name: credit_period
        description: Zahlungsziel
        data_type: numeric(38,18)
      - name: deductions
        description: Abzüge
        data_type: numeric(38,18)
      - name: sum_payed
        description: Gezahlter Betrag
        data_type: numeric(38,18)
      - name: hours_worked
        description: Geleistete Stunden
        data_type: numeric(38,18)
      - name: subtractions
        description: Subtraktionen
        data_type: numeric(38,18)
      - name: credit_rating_check
        description: Kreditprüfung
        data_type: numeric(38,18)
      - name: discount
        description: Rabatt
        data_type: numeric(38,18)
      - name: ordering
        description: Sortierung
        data_type: numeric(38,18)
      - name: createdby
        description: Ersteller
        data_type: nvarchar(4000)
      - name: member
        description: Mitglied
        data_type: nvarchar(4000)
      - name: pay_target_date
        description: Zahlungszieldatum
        data_type: datetime2(7)
      - name: u_amount
        description: USt Betrag
        data_type: numeric(38,18)
      - name: comission_amount
        description: Provisionsbetrag
        data_type: numeric(38,18)
      - name: subscription
        description: Subscription
        data_type: nvarchar(4000)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null

  - name: sat_project
    description: Satellite mit Projekt-Attributen
    columns:
      - name: hk_project
        description: Hash Key (FK zu hub_project)
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_project')
              field: hk_project
      - name: hd_project
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: name
        description: Projektname
        data_type: nvarchar(4000)
      - name: state
        description: Status
        data_type: nvarchar(4000)
      - name: begin
        description: Startdatum
        data_type: datetime2(7)
      - name: location
        description: Standort
        data_type: nvarchar(4000)
      - name: price
        description: Preis
        data_type: numeric(38,18)
      - name: commission
        description: Provision
        data_type: numeric(38,18)
      - name: end
        description: Enddatum
        data_type: datetime2(7)
      - name: work_begin
        description: Arbeitsbeginn
        data_type: nvarchar(4000)
      - name: author_email
        description: Autor E-Mail
        data_type: nvarchar(4000)
      - name: description
        description: Beschreibung
        data_type: nvarchar(4000)
      - name: price_units_value
        description: Preiseinheiten
        data_type: nvarchar(4000)
      - name: commission_units_value
        description: Provisionseinheiten
        data_type: nvarchar(4000)
      - name: details
        description: Details
        data_type: nvarchar(4000)
      - name: client
        description: Auftraggeber FK
        data_type: bigint
      - name: contractor
        description: Auftragnehmer FK
        data_type: bigint
      - name: member
        description: Mitglied
        data_type: nvarchar(4000)
      - name: subscription
        description: Subscription
        data_type: nvarchar(4000)
      - name: user
        description: Benutzer FK
        data_type: bigint
      - name: provision_charged_state
        description: Provision abgerechnet Status
        data_type: nvarchar(4000)
      - name: contractor_count
        description: Anzahl Auftragnehmer
        data_type: int
      - name: hidden
        description: Versteckt Flag
        data_type: bit
      - name: is_contracting
        description: Contracting Flag
        data_type: bit
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null

  - name: eff_sat_company_country
    description: |
      Effectivity Satellite zur Erfassung der zeitlichen Gültigkeit
      der Beziehung zwischen Company und Country.
    columns:
      - name: hk_link_company_country
        description: Hash Key (FK zu link_company_country)
        data_type: char(64)
        tests:
          - not_null
      - name: dss_start_date
        description: Gültig ab
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_end_date
        description: Gültig bis
        data_type: datetime2(7)
      - name: dss_is_current
        description: Aktuell gültig Flag
        data_type: char(1)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)

  # =============================================================================
  # LINKS
  # =============================================================================
  - name: link_company_country
    description: Link zwischen Company und Country
    columns:
      - name: hk_link_company_country
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hk_company
        description: FK zu hub_company
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_company')
              field: hk_company
      - name: hk_country
        description: FK zu hub_country
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_country')
              field: hk_country
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  - name: link_company_role
    description: Link zwischen Company und Role (ref_role)
    columns:
      - name: hk_link_company_role
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: hk_company
        description: FK zu hub_company
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_company')
              field: hk_company
      - name: hk_role
        description: FK zu ref_role (seed)
        data_type: char(64)
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null
