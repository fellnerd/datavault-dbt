version: 2

models:
  # =============================================================================
  # HUBS
  # =============================================================================
  - name: hub_customer
    description: Hub für AdventureWorks Customers
    columns:
      - name: hk_customer
        description: Hash Key (Primary Key)
        data_type: char(64)
        tests:
          - not_null
          - unique
      - name: CustomerID
        description: Business Key
        data_type: int
        tests:
          - not_null
      - name: dss_load_date
        description: Erstes Ladedatum
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: varchar(100)
        tests:
          - not_null

  # =============================================================================
  # SATELLITES
  # =============================================================================
  - name: sat_customer
    description: Satellite mit Customer-Attributen aus AdventureWorks
    columns:
      - name: hk_customer
        description: Hash Key (FK zu hub_customer)
        data_type: char(64)
        tests:
          - not_null
          - relationships:
              to: ref('hub_customer')
              field: hk_customer
      - name: hd_customer
        description: Hash Diff für Change Detection
        data_type: char(64)
        tests:
          - not_null
      - name: NameStyle
        description: Name Style Flag
        data_type: bit
      - name: Title
        description: Anrede
        data_type: nvarchar(4000)
      - name: FirstName
        description: Vorname
        data_type: nvarchar(4000)
      - name: MiddleName
        description: Mittelname
        data_type: nvarchar(4000)
      - name: LastName
        description: Nachname
        data_type: nvarchar(4000)
      - name: Suffix
        description: Namenszusatz
        data_type: nvarchar(4000)
      - name: CompanyName
        description: Firmenname
        data_type: nvarchar(4000)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
        tests:
          - not_null
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
        tests:
          - not_null
