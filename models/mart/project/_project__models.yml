version: 2

models:
  # =============================================================================
  # CURRENT STATE VIEWS
  # =============================================================================
  - name: company_current_v
    description: |
      Aktueller Stand aller Companies aus dem Data Vault.
      Kombiniert Hub und Satellite mit dss_is_current = 'Y'.
    columns:
      - name: hk_company
        description: Hash Key
        data_type: char(64)
        tests:
          - not_null
      - name: name
        description: Firmenname
        data_type: nvarchar(4000)
      - name: subscription
        description: Subscription
        data_type: nvarchar(4000)
      - name: org_type
        description: Organisationstyp
        data_type: bigint
      - name: uid
        description: Umsatzsteuer-ID
        data_type: nvarchar(4000)
      - name: description
        description: Beschreibung
        data_type: nvarchar(4000)
      - name: street
        description: Straße
        data_type: nvarchar(4000)
      - name: citycode
        description: Postleitzahl
        data_type: nvarchar(4000)
      - name: city
        description: Stadt
        data_type: nvarchar(4000)
      - name: province
        description: Bundesland/Provinz
        data_type: nvarchar(4000)
      - name: state
        description: Status
        data_type: nvarchar(4000)
      - name: country
        description: Land FK
        data_type: bigint
      - name: website
        description: Website URL
        data_type: nvarchar(4000)
      - name: email
        description: E-Mail Adresse
        data_type: nvarchar(4000)
      - name: phone
        description: Telefonnummer
        data_type: nvarchar(4000)
      - name: mobile
        description: Mobilnummer
        data_type: nvarchar(4000)
      - name: mobile2
        description: Zweite Mobilnummer
        data_type: nvarchar(4000)
      - name: fax
        description: Faxnummer
        data_type: nvarchar(4000)
      - name: bic
        description: BIC Code
        data_type: nvarchar(4000)
      - name: iban
        description: IBAN
        data_type: nvarchar(4000)
      - name: credit_rating
        description: Kreditwürdigkeit
        data_type: nvarchar(4000)
      - name: commission_fee
        description: Provisionsgebühr
        data_type: nvarchar(4000)
      - name: employeecount
        description: Mitarbeiteranzahl
        data_type: numeric(38,0)
      - name: date_created
        description: Erstellungsdatum
        data_type: datetime2(7)
      - name: date_updated
        description: Aktualisierungsdatum
        data_type: datetime2(7)
      - name: hd_company
        description: Hash Diff
        data_type: char(64)
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
      - name: dss_record_source
        description: Datenquelle
        data_type: nvarchar(4000)
      - name: dss_is_current
        description: Aktuell Flag
        data_type: varchar(1)
        tests:
          - not_null
          - accepted_values:
              values: ['Y']

  - name: customer_current_v
    description: |
      Aktueller Stand aller AdventureWorks Customers.
      Kombiniert Hub und Satellite.
    columns:
      - name: hk_customer
        description: Hash Key
        data_type: char(64)
        tests:
          - not_null
      - name: CustomerID
        description: Business Key
        data_type: int
        tests:
          - not_null
      - name: NameStyle
        description: Name Style Flag
        data_type: bit
      - name: Title
        description: Anrede
        data_type: nvarchar(4000)
      - name: FirstName
        description: Vorname
        data_type: nvarchar(4000)
      - name: MiddleName
        description: Mittelname
        data_type: nvarchar(4000)
      - name: LastName
        description: Nachname
        data_type: nvarchar(4000)
      - name: Suffix
        description: Namenszusatz
        data_type: nvarchar(4000)
      - name: CompanyName
        description: Firmenname
        data_type: nvarchar(4000)
      - name: hub_load_date
        description: Hub Ladezeitpunkt
        data_type: datetime2(7)
