version: 2

models:
  # =============================================================================
  # GEMEINSAME DIMENSIONEN
  # =============================================================================
  - name: dim_date_v
    description: |
      View-Wrapper auf dim_date (Tabelle). Stellt konsistentes View-Interface
      für BI-Tools sicher (kein gemischtes Tabellen-/View-Schema im mart Schema).
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null

  - name: dim_date
    description: |
      Date Dimension für Reporting und Analyse (materialized='table').
      Enthält alle Datumswerte mit diversen Aggregationsebenen.
      Zugriff via dim_date_v (View-Wrapper).
    columns:
      - name: date_key
        description: Surrogate Key (YYYYMMDD Format)
        data_type: int
        tests:
          - not_null
          - unique
      - name: full_date
        description: Vollständiges Datum
        data_type: date
        tests:
          - not_null
      - name: year
        description: Jahr (YYYY)
        data_type: int
      - name: year_name
        description: Jahr als Text
        data_type: char(4)
      - name: iso_year
        description: ISO-Wochenjahr (weicht von year() bei Jahresgrenzen ab, z.B. 1. Jan 2021 = ISO-Jahr 2020)
        data_type: int
      - name: quarter
        description: Quartal (1-4)
        data_type: int
      - name: quarter_name
        description: Quartal als Text (Q1, Q2, etc.)
        data_type: char(2)
      - name: year_quarter
        description: Jahr-Quartal (2024Q1)
        data_type: char(7)
      - name: month
        description: Monat (1-12)
        data_type: int
      - name: month_name
        description: Monatsname
        data_type: varchar(10)
      - name: month_name_short
        description: Monatsname kurz (Jan, Feb, etc.)
        data_type: char(3)
      - name: year_month
        description: Jahr-Monat (2024-01)
        data_type: char(7)
      - name: iso_week
        description: ISO Kalenderwoche
        data_type: int
      - name: year_week
        description: Jahr-Woche (2024W01)
        data_type: char(7)
      - name: day_of_month
        description: Tag im Monat (1-31)
        data_type: int
      - name: day_of_year
        description: Tag im Jahr (1-366)
        data_type: int
      - name: day_of_week
        description: Wochentag ISO (1=Montag, 7=Sonntag — DATEFIRST-unabhängig)
        data_type: int
      - name: day_name
        description: Wochentagsname
        data_type: varchar(10)
      - name: day_name_short
        description: Wochentagsname kurz (Mon, Tue, etc.)
        data_type: char(3)
      - name: is_weekend
        description: Wochenende Flag (Y/N, DATEFIRST-unabhängig)
        data_type: char(1)
      - name: is_weekday
        description: Arbeitstag Flag (Y/N, DATEFIRST-unabhängig)
        data_type: char(1)
      - name: is_first_day_of_month
        description: Erster Tag im Monat (Y/N)
        data_type: char(1)
      - name: is_last_day_of_month
        description: Letzter Tag im Monat (Y/N)
        data_type: char(1)
      - name: is_first_day_of_quarter
        description: Erster Tag im Quartal (Y/N)
        data_type: char(1)
      - name: is_last_day_of_quarter
        description: Letzter Tag im Quartal (Y/N)
        data_type: char(1)
      - name: is_first_day_of_year
        description: Erster Tag im Jahr (Y/N)
        data_type: char(1)
      - name: is_last_day_of_year
        description: Letzter Tag im Jahr (Y/N)
        data_type: char(1)
      - name: last_day_of_month
        description: Letzter Tag des Monats (DATE)
        data_type: date
      - name: first_day_of_month
        description: Erster Tag des Monats (DATE)
        data_type: date
      - name: first_day_of_quarter
        description: Erster Tag des Quartals (DATE)
        data_type: date
      - name: last_day_of_quarter
        description: Letzter Tag des Quartals (DATE)
        data_type: date
      - name: first_day_of_year
        description: Erster Tag des Jahres
        data_type: date
      - name: last_day_of_year
        description: Letzter Tag des Jahres
        data_type: date
      - name: same_day_last_year
        description: Gleicher Tag im Vorjahr
        data_type: date
      - name: dss_load_date
        description: Ladezeitpunkt
        data_type: datetime2(7)
