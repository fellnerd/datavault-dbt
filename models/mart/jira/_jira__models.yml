version: 2

models:
  - name: dim_vorgang
    description: "Dimension table for dim_vorgang"
    columns:
      - name: dim_vorgang_key
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: issue_id
        description: "Business key"
      - name: summary

  - name: dim_project
    description: "Dimension table for dim_project"
    columns:
      - name: dim_project_key
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Business key"
      - name: name

  - name: dim_vorgang_status
    description: "Dimension table for dim_vorgang_status"
    columns:
      - name: dim_vorgang_status_key
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: issue_status_id
        description: "Business key"
      - name: issue_status_name
      - name: description

  - name: fact_vorgang
    description: "Fact table for fact_vorgang"
